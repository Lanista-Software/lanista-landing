[build]
command = "yarn build"
publish = "dist"

[build.environment]
NODE_VERSION = "22"

# Turkish moved from /tr/ to the root. Old Turkish URLs keep their ranking via 301.
[[redirects]]
from = "/tr/*"
to = "/:splat"
status = 301
force = true

[[redirects]]
from = "/tr"
to = "/"
status = 301
force = true

[[headers]]
for = "/_astro/*"

[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "/*"

[headers.values]
X-Content-Type-Options = "nosniff"
Referrer-Policy = "strict-origin-when-cross-origin"
Permissions-Policy = "camera=(), microphone=(), geolocation=()"
